<div class="upcoming-appointments">
  <div class="section-header">
    <h2><i class="fas fa-calendar-check"></i> Upcoming Appointments</h2>
    <a href="/doctor/nexus-direct/appointments" class="view-all-link">View All</a>
  </div>

  <div *ngIf="loading" class="loading-state">
    <div class="spinner"></div>
    <p>Loading appointments...</p>
  </div>

  <div *ngIf="!loading && appointments.length > 0" class="appointments-list">
    <div *ngFor="let appt of appointments; let last = last" class="appointment-item" [class.last]="last">
      <div class="appointment-time">
        <span class="time">{{ appt.time }}</span>
      </div>

      <div class="appointment-details">
        <div class="patient-info">
          <div class="patient-avatar" [style.backgroundColor]="getStatusColor(appt.status)">
            {{ appt.patientAvatar }}
          </div>
          <div class="patient-content">
            <h4>{{ appt.patientName }}</h4>
            <p class="appointment-type">{{ appt.type }}</p>
          </div>
        </div>

        <div class="appointment-status">
          <span class="status-badge" [ngClass]="appt.status">
            {{ appt.status | titlecase }}
          </span>
        </div>
      </div>

      <div class="appointment-actions">
        <button class="action-btn primary" title="Start Consultation">📞</button>
        <button class="action-btn secondary" title="Reschedule">🔄</button>
      </div>
    </div>
  </div>

  <div *ngIf="!loading && appointments.length === 0" class="empty-state">
    <div class="empty-icon">📭</div>
    <p>No upcoming appointments</p>
  </div>
</div>
