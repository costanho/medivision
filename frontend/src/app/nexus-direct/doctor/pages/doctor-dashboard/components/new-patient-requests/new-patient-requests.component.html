<div class="new-patient-requests">
  <div class="section-header">
    <h2><i class="fas fa-user-plus"></i> New Patient Requests</h2>
    <a href="/doctor/nexus-direct/patients" class="view-all-link">View All</a>
  </div>

  <div *ngIf="loading" class="loading-state">
    <div class="spinner"></div>
    <p>Loading requests...</p>
  </div>

  <div *ngIf="!loading && requests.length > 0" class="requests-list">
    <div *ngFor="let request of requests; let last = last" class="request-item" [class.last]="last">
      <div class="request-avatar">{{ (request.patientName.split(' ')[0].charAt(0) + request.patientName.split(' ')[1].charAt(0)).toUpperCase() }}</div>

      <div class="request-info">
        <h4>{{ request.patientName }}</h4>
        <p class="contact-info">{{ request.email }}</p>
        <p class="phone-info">{{ request.phone }}</p>
      </div>

      <div class="request-date">{{ request.requestDate }}</div>

      <div class="request-actions">
        <button class="action-btn accept"><i class="fas fa-check"></i> Accept</button>
        <button class="action-btn decline"><i class="fas fa-times"></i> Decline</button>
      </div>
    </div>
  </div>

  <div *ngIf="!loading && requests.length === 0" class="empty-state">
    <div class="empty-icon"><i class="fas fa-users"></i></div>
    <p>No new patient requests</p>
  </div>
</div>
