<nav class="top-navbar" [class.ionic-navbar]="isIonic">
  <div class="navbar-left">
    <!-- Mobile & Tablet Menu Toggle -->
    <button class="menu-toggle" (click)="toggleMobileMenu()" *ngIf="isMobile || isTablet">
      <i [class]="isMobileMenuOpen ? 'fas fa-times' : 'fas fa-bars'"></i>
    </button>

    <!-- Brand Logo & Text -->
    <div class="navbar-brand">
      <img src="assets/images/carenexus-logo.svg" alt="CareNexus Logo" class="brand-logo-img">
      <span class="brand-text" *ngIf="!isMobile || !isMobileMenuOpen">CareNexus</span>
    </div>
  </div>

  <!-- Center: Search Bar (Desktop & Tablet) -->
  <div class="navbar-center" *ngIf="!isMobile || isSearchOpen">
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input type="text" placeholder="Search..."
             (keyup.escape)="isSearchOpen = false">
    </div>
  </div>

  <!-- Right: Actions & Profile -->
  <div class="navbar-right">
    <!-- Search Toggle for Mobile -->
    <button class="search-toggle" (click)="toggleSearch()" *ngIf="isMobile && !isSearchOpen">
      <i class="fas fa-search"></i>
    </button>

    <!-- Notification Badges (Desktop & Tablet) -->
    <div class="notification-badges" *ngIf="!isMobile">
      <button class="icon-btn notification" title="Appointments">
        <span class="badge">{{ appointmentBadge }}</span>
        <i class="fas fa-calendar"></i>
        <span class="label">Appointment</span>
      </button>
      <button class="icon-btn" title="Messages">
        <span class="badge">{{ messageBadge }}</span>
        <i class="fas fa-envelope"></i>
        <span class="label">Messages</span>
      </button>
    </div>

    <!-- Mobile Notification Icons (Compact) -->
    <div class="notification-compact" *ngIf="isMobile && !isSearchOpen">
      <button class="icon-compact" title="Appointments">
        <span class="badge" *ngIf="appointmentBadge > 0">{{ appointmentBadge }}</span>
        <i class="fas fa-calendar"></i>
      </button>
      <button class="icon-compact" title="Messages">
        <span class="badge" *ngIf="messageBadge > 0">{{ messageBadge }}</span>
        <i class="fas fa-envelope"></i>
      </button>
    </div>

    <!-- User Profile Section -->
    <div class="user-profile-header">
      <div class="user-avatar" [style.background-color]="getAvatarColor()">
        {{ getInitials() }}
      </div>
      <div class="user-info" *ngIf="!isMobile">
        <p class="user-name">{{ currentUser?.fullName }}</p>
        <p class="user-role">Doctor</p>
        <button class="logout-btn-inline" (click)="logout()">
          <i class="fas fa-sign-out-alt"></i>
          <span>Logout</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile Menu Overlay -->
  <div class="mobile-menu-overlay" *ngIf="isMobileMenuOpen && isMobile" (click)="closeMobileMenu()"></div>
</nav>
