<div class="participant-list">
  <div class="header">
    <h3>Participants ({{ participants.length }})</h3>
  </div>

  <div class="participants-scroll">
    <div *ngFor="let participant of visibleParticipants"
         class="participant-card"
         [class.current]="participant.userId === currentUserId"
         (click)="onParticipantClick(participant.userId)">

      <!-- Avatar -->
      <div class="avatar">
        <div class="avatar-placeholder">
          {{ participant.userName.charAt(0).toUpperCase() }}
        </div>
      </div>

      <!-- Info -->
      <div class="info">
        <div class="name">{{ participant.userName }}</div>
        <div class="status" [ngClass]="'status-' + participant.status.toLowerCase()">
          {{ getStatusLabel(participant.status) }}
        </div>
      </div>

      <!-- Status indicators -->
      <div class="indicators">
        <span *ngIf="!isAudioEnabled(participant)" class="indicator" title="Audio muted">🔇</span>
        <span *ngIf="!isVideoEnabled(participant)" class="indicator" title="Video off">📹</span>
      </div>

      <!-- Actions (doctor only) -->
      <div class="actions" *ngIf="canRemoveParticipant(participant)">
        <button class="btn-action"
                (click)="onRemoveParticipant($event, participant.userId)"
                title="Remove participant">
          ✕
        </button>
      </div>
    </div>
  </div>

  <!-- Show more button -->
  <button *ngIf="hiddenCount > 0 && !showAll"
          class="show-more"
          (click)="showAllParticipants()">
    Show {{ hiddenCount }} more
  </button>
</div>
