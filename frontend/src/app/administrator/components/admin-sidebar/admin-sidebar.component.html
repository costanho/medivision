<!-- Sidebar Overlay (Mobile only) -->
<div class="sidebar-overlay"
     *ngIf="(isMobile || isTablet) && sidebarOpen"
     (click)="closeSidebarMobile()"></div>

<!-- Main Sidebar -->
<aside class="admin-sidebar"
       [class.is-desktop]="!isMobile && !isTablet"
       [class.is-mobile]="isMobile"
       [class.is-tablet]="isTablet"
       [class.is-small-phone]="isSmallPhone"
       [class.collapsed]="sidebarCollapsed"
       [class.mobile-open]="sidebarOpen && (isMobile || isTablet)">

  <!-- Back Button -->
  <button class="back-btn" (click)="goBack()">
    <i class="fas fa-arrow-left"></i>
    <span class="back-label">Back</span>
  </button>

  <!-- Navigation -->
  <nav class="sidebar-nav">
    <!-- Dashboard -->
    <div class="nav-section">
      <div class="nav-item" (click)="navigateTo('/admin/dashboard')">
        <i class="fas fa-tachometer-alt nav-icon"></i>
        <span class="nav-label">Dashboard</span>
      </div>
    </div>

    <div class="nav-divider"></div>

    <!-- User Management -->
    <div class="nav-section">
      <div class="nav-label-header">User Management</div>

      <div class="nav-item expandable" [class.expanded]="isUserManagementExpanded" (click)="toggleUserManagement()">
        <i class="fas fa-users nav-icon"></i>
        <span class="nav-label">Manage Users</span>
        <span class="expand-icon" [class.open]="isUserManagementExpanded">¶</span>
      </div>

      <div class="nav-submenu" [class.visible]="isUserManagementExpanded">
        <div class="nav-item sub-item" (click)="navigateTo('/admin/patients')">
          <i class="fas fa-user-injured nav-icon"></i>
          <span class="nav-label">Patients</span>
        </div>
        <div class="nav-item sub-item" (click)="navigateTo('/admin/doctors')">
          <i class="fas fa-user-md nav-icon"></i>
          <span class="nav-label">Doctors</span>
        </div>
        <div class="nav-item sub-item" (click)="navigateTo('/admin/users/add')">
          <i class="fas fa-user-plus nav-icon"></i>
          <span class="nav-label">Add User</span>
        </div>
      </div>
    </div>

    <div class="nav-divider"></div>

    <!-- Payments & Billing -->
    <div class="nav-section">
      <div class="nav-label-header">Financial</div>

      <div class="nav-item expandable" [class.expanded]="isPaymentsExpanded" (click)="togglePayments()">
        <i class="fas fa-credit-card nav-icon"></i>
        <span class="nav-label">Payments</span>
        <span class="expand-icon" [class.open]="isPaymentsExpanded">¶</span>
      </div>

      <div class="nav-submenu" [class.visible]="isPaymentsExpanded">
        <div class="nav-item sub-item" (click)="navigateTo('/admin/payments/transactions')">
          <i class="fas fa-exchange-alt nav-icon"></i>
          <span class="nav-label">Transactions</span>
        </div>
        <div class="nav-item sub-item" (click)="navigateTo('/admin/payments/reports')">
          <i class="fas fa-file-invoice-dollar nav-icon"></i>
          <span class="nav-label">Reports</span>
        </div>
        <div class="nav-item sub-item" (click)="navigateTo('/admin/payments/refunds')">
          <i class="fas fa-undo nav-icon"></i>
          <span class="nav-label">Refunds</span>
        </div>
      </div>
    </div>

    <div class="nav-divider"></div>

    <!-- Analytics -->
    <div class="nav-section">
      <div class="nav-label-header">Insights</div>

      <div class="nav-item expandable" [class.expanded]="isAnalyticsExpanded" (click)="toggleAnalytics()">
        <i class="fas fa-chart-line nav-icon"></i>
        <span class="nav-label">Analytics</span>
        <span class="expand-icon" [class.open]="isAnalyticsExpanded">¶</span>
      </div>

      <div class="nav-submenu" [class.visible]="isAnalyticsExpanded">
        <div class="nav-item sub-item" (click)="navigateTo('/admin/analytics/users')">
          <i class="fas fa-users-cog nav-icon"></i>
          <span class="nav-label">User Stats</span>
        </div>
        <div class="nav-item sub-item" (click)="navigateTo('/admin/analytics/appointments')">
          <i class="fas fa-calendar-check nav-icon"></i>
          <span class="nav-label">Appointments</span>
        </div>
        <div class="nav-item sub-item" (click)="navigateTo('/admin/analytics/revenue')">
          <i class="fas fa-dollar-sign nav-icon"></i>
          <span class="nav-label">Revenue</span>
        </div>
        <div class="nav-item sub-item" (click)="navigateTo('/admin/analytics/health')">
          <i class="fas fa-heartbeat nav-icon"></i>
          <span class="nav-label">System Health</span>
        </div>
      </div>
    </div>

    <div class="nav-divider"></div>

    <!-- System -->
    <div class="nav-section">
      <div class="nav-label-header">System</div>

      <div class="nav-item" (click)="navigateTo('/admin/settings')">
        <i class="fas fa-cog nav-icon"></i>
        <span class="nav-label">Settings</span>
      </div>

      <div class="nav-item" (click)="navigateTo('/admin/logs')">
        <i class="fas fa-clipboard-list nav-icon"></i>
        <span class="nav-label">Activity Logs</span>
      </div>

      <div class="nav-item" (click)="navigateTo('/admin/security')">
        <i class="fas fa-shield-alt nav-icon"></i>
        <span class="nav-label">Security</span>
      </div>
    </div>

    <div class="nav-divider"></div>

    <!-- Support -->
    <div class="nav-section">
      <div class="nav-item" (click)="navigateTo('/admin/help')">
        <i class="fas fa-question-circle nav-icon"></i>
        <span class="nav-label">Help & Support</span>
      </div>
    </div>
  </nav>

  <!-- Logout Button -->
  <button class="logout-btn" (click)="logout()">
    <i class="fas fa-sign-out-alt"></i>
    <span class="logout-label">Logout</span>
  </button>
</aside>
