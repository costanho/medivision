[pytest]
# Pytest configuration for Carenexus AI Backend

# Minimum Python version
minversion = 7.0

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --color=yes
    -ra

# Test paths
testpaths = tests

# Markers for test categorization
markers =
    unit: unit tests (fast, no dependencies)
    integration: integration tests (may require services)
    e2e: end-to-end tests (full system)
    slow: slow running tests
    requires_db: tests requiring database
    requires_llm: tests requiring LLM service

# Asyncio mode for pytest-asyncio
asyncio_mode = auto

# Coverage options
[coverage:run]
source = app
omit =
    */tests/*
    */site-packages/*
    app/main.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstract
    @abstractmethod
